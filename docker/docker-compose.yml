services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rudra
      POSTGRES_PASSWORD: rudra
      POSTGRES_DB: rudra_control
    ports:
      - "5432:5432"
    volumes:
      - rudra_pg:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - rudra_mongo:/data/db

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rudra_minio:/data

volumes:
  rudra_pg:
  rudra_mongo:
  rudra_minio:
